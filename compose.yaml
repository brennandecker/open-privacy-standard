services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${OPS_DB_PASSWORD:?Run node scripts/setup-env.mjs}
    volumes:
      - consent-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://ops:${OPS_DB_PASSWORD}@database:5432/ops
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      database:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://ops:${OPS_DB_PASSWORD}@database:5432/ops
      OPS_CREDENTIALS: ${OPS_CREDENTIALS:?Run node scripts/setup-env.mjs}
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  consent-data:
